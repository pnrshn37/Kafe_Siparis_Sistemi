<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Şifremi Unuttum | Umay Ana</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='forgot-password.css') }}">
</head>
<body>

<div class="forgot-page">
    <div class="forgot-card">

        <div class="forgot-logo">
            <img src="{{ url_for('static', filename='images/logo-removebg-preview.png') }}" alt="Umay Ana Logo">
            <h1>Şifremi Unuttum</h1>
            <p>Hesabınızı doğrulayın ve yeni şifre oluşturun</p>
        </div>

        <form class="forgot-form">

            <label>Kullanıcı Adı</label>
            <div class="input-group">
                <span class="input-icon">👤</span>
                <input type="text" placeholder="Kullanıcı adınızı girin">
            </div>

            <label>Telefon Numarası</label>
            <div class="input-group">
                <span class="input-icon">📞</span>
                <input type="text" placeholder="05XX XXX XX XX">
            </div>

            <label>E-Mail Adresi</label>
            <div class="input-group">
                <span class="input-icon">✉️</span>
                <input type="email" placeholder="E-Mail adresinizi girin">
            </div>

            <label>Yeni Şifre</label>
            <div class="input-group">
                <span class="input-icon">🔒</span>
                <input type="password" placeholder="Yeni şifrenizi girin">
            </div>

            <label>Yeni Şifre Tekrar</label>
            <div class="input-group">
                <span class="input-icon">🔁</span>
                <input type="password" placeholder="Yeni şifrenizi tekrar girin">
            </div>

            <button type="button">Şifreyi Güncelle</button>

        </form>

        <a href="{{ url_for('login') }}" class="back-login">
            ← Giriş ekranına dön
        </a>

    </div>
</div>

</body>
</html>
